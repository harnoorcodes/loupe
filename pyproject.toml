[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loupe"
version = "0.1.0"
description = "Multi-agent due diligence system for M&A data rooms"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as function-call defaults. This is the
# framework's documented pattern, not the mutable-default bug B008 targets.
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]